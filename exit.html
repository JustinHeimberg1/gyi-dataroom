<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exit & Moat · getyourintro Data Room</title><style>
:root{--paper:#09090B;--surface:#141417;--surface2:#1F1F23;--ink:#FAFAFA;--muted:#A1A1AA;--border:#303036;--neg:#F87171;--serif:Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 clamp(20px,5vw,56px)}
a{color:var(--ink)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid var(--border);padding:22px 0;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:600;font-size:20px}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.hero{padding:44px 0 8px}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,5vw,48px);line-height:1.06;letter-spacing:-.015em;margin:0 0 16px;max-width:20ch}
.lede{font-size:clamp(16px,1.9vw,19px);max-width:64ch;margin:0 0 24px;color:var(--muted)}.lede b{color:var(--ink)}
h2.head{font-family:var(--serif);font-weight:600;font-size:clamp(24px,4vw,38px);letter-spacing:-.015em;margin:0 0 8px}
h3.sub{font-family:var(--sans);font-size:14px;font-weight:700;margin:26px 0 12px}
.ill{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.block{padding:8px 0 40px}
p{max-width:72ch;color:var(--muted)}p b{color:var(--ink)}
.muted{color:var(--muted)}
ul.ticks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:11px}
ul.ticks li{position:relative;padding-left:22px;color:var(--muted)}ul.ticks li b{color:var(--ink)}
ul.ticks li::before{content:"";position:absolute;left:3px;top:9px;width:7px;height:7px;background:var(--ink);border-radius:2px;transform:rotate(45deg)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface);margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:11px 16px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
thead th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
tbody tr:last-child td{border-bottom:0}
td.neg{color:var(--neg)}td.mut{color:var(--muted)}
.stats,.stats4{display:grid;gap:14px;margin-top:14px}.stats{grid-template-columns:repeat(3,1fr)}.stats4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.stat .b{font-family:var(--serif);font-weight:600;font-size:clamp(20px,3vw,26px);letter-spacing:-.01em}
.stat .l{font-size:12px;color:var(--muted);margin-top:7px}
.note{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:14px}
.btn{display:inline-block;padding:13px 20px;border-radius:12px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--ink);border-color:rgba(255,255,255,.16)}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.fq{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--surface);overflow:hidden}
.fq summary{cursor:pointer;padding:15px 18px;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
.fq summary::-webkit-details-marker{display:none}
.fq summary::after{content:"+";color:var(--muted);font-size:20px;line-height:1}
.fq[open] summary::after{content:"\2013"}
.fq .ans{padding:0 18px 16px;color:var(--muted);font-size:14.5px;line-height:1.6}
.grp{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 9px}
.fine{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px;max-width:95ch}
.foot{padding:26px 0 56px;border-top:1px solid var(--border);margin-top:24px}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:8px}
.nav a{display:block;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;text-decoration:none;transition:border-color .15s,background .15s}
.nav a:hover{border-color:rgba(255,255,255,.4);background:var(--surface2)}
.nav .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.nav h3{font-family:var(--serif);font-weight:600;font-size:19px;margin:8px 0 6px;color:var(--ink)}
.nav p{font-size:13.5px;color:var(--muted);margin:0}
.demo{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;margin-top:14px}
.phone{position:relative;width:238px;aspect-ratio:9/19.5;border-radius:47px;background:linear-gradient(145deg,#4c4c50,#1c1c1e 44%,#0b0b0d);box-shadow:0 34px 70px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.14);overflow:hidden;flex:none}
.phone::before{content:"";position:absolute;z-index:8;top:15px;left:50%;transform:translateX(-50%);width:84px;height:25px;background:#000;border-radius:14px}
.reel{position:absolute;inset:9px;border-radius:39px;overflow:hidden;background:#000}
.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:reel 20s infinite}
.reel img:nth-child(1){animation-delay:0s}.reel img:nth-child(2){animation-delay:4s}.reel img:nth-child(3){animation-delay:8s}.reel img:nth-child(4){animation-delay:12s}.reel img:nth-child(5){animation-delay:16s}
@keyframes reel{0%{opacity:0;transform:scale(1.03)}2%{opacity:1;transform:scale(1)}18%{opacity:1}20%{opacity:0;transform:scale(1.03)}100%{opacity:0}}
.tap{position:absolute;left:50%;bottom:5.5%;width:38px;height:38px;margin-left:-19px;border-radius:50%;z-index:6;background:rgba(255,255,255,.4);border:1.5px solid rgba(255,255,255,.75);animation:tap 4s infinite}
@keyframes tap{0%,100%{opacity:0;transform:scale(.45)}4%{opacity:.9;transform:scale(.7)}14%{opacity:0;transform:scale(1.7)}30%{opacity:0}}
.reel-legend{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:12px;color:var(--muted)}.reel-legend b{color:var(--ink)}
@media(prefers-reduced-motion:reduce){.reel img{animation:none}.reel img:nth-child(1){opacity:1}.tap{display:none}}
@media(max-width:720px){.cols,.stats,.stats4{grid-template-columns:1fr}.stats4{grid-template-columns:1fr 1fr}.demo{grid-template-columns:1fr;justify-items:center}}
/* gate + shell */
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;overflow:hidden;background:var(--paper);z-index:100}
#gate video.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#gate .ov{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.64))}
.gatecard{position:relative;z-index:3;width:100%;max-width:430px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:38px 34px 30px;text-align:center}
.g-brand{font-family:var(--serif);font-weight:600;font-size:22px;color:#fff;margin:0 0 18px}
.lock{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;margin:0 auto 18px}
.lock svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#gate h1{font-family:var(--serif);font-weight:600;font-size:28px;margin:0 0 8px;color:#fff}
#gate .gsub{color:rgba(255,255,255,.72);font-size:14px;margin:0 auto 22px;max-width:34ch}
#pw{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:16px;text-align:center;letter-spacing:.15em}
#pw::placeholder{letter-spacing:.02em;color:rgba(255,255,255,.5)}#pw:focus{outline:none;border-color:rgba(255,255,255,.65)}
#go{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#fff;color:#09090B;font-weight:700;font-size:15px;cursor:pointer}
#err{color:#fff;font-size:13px;min-height:18px;margin-top:12px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.g-foot{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}
#app{display:none}
#top{position:sticky;top:0;z-index:5;height:52px;display:flex;align-items:center;gap:18px;padding:0 clamp(20px,5vw,56px);background:rgba(9,9,11,.92);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
#top a{color:var(--muted);text-decoration:none}#top a:hover{color:var(--ink)}#top .t{color:var(--ink)}
#frame{width:100%;height:calc(100vh - 52px);border:0;background:var(--paper)}

async function dec(pw,blob){var r=Uint8Array.from(atob(blob),function(c){return c.charCodeAt(0)});var salt=r.slice(0,16),iv=r.slice(16,28),d=r.slice(28);var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,d);return new TextDecoder().decode(pt)}
