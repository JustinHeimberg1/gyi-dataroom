<title>Unterlagen & Diligence · getyourintro Data Room</title><style>

:root{--paper:#09090B;--surface:#141417;--surface2:#1C1C20;--surface3:#232328;--ink:#FAFAFA;
--muted:#A1A1AA;--muted2:#71717A;--border:#2A2A31;--border2:#3A3A43;--accent:#FF8052;
--pos:#4ADE80;--neg:#F87171;--warn:#FBBF24;
--serif:Georgia,"Iowan Old Style","Times New Roman",serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:15px}
.wrap{max-width:1020px;margin:0 auto;padding:0 clamp(20px,5vw,56px)}
a{color:var(--ink)}
::selection{background:var(--accent);color:#09090B}

.mast{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid var(--border);padding:22px 0;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:-.01em}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.hero{padding:46px 0 8px}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,5.2vw,50px);line-height:1.05;letter-spacing:-.018em;margin:0 0 18px;max-width:22ch;color:var(--ink)}
.lede{font-size:clamp(16px,1.9vw,19px);max-width:66ch;margin:0 0 24px;color:var(--muted);line-height:1.55}
.lede b{color:var(--ink);font-weight:600}
h2.head{font-family:var(--serif);font-weight:600;font-size:clamp(23px,3.6vw,34px);letter-spacing:-.015em;margin:0 0 10px;line-height:1.15}
h3.sub{font-family:var(--sans);font-size:13px;font-weight:700;margin:32px 0 12px;letter-spacing:.01em}
h4.mini{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.block{padding:6px 0 44px}
.block.tight{padding-bottom:26px}
p{max-width:74ch;color:var(--muted);margin:0 0 14px}
p b,li b{color:var(--ink);font-weight:600}
p.big{font-size:17px;color:var(--ink);max-width:66ch}
.muted{color:var(--muted)}
.dim{color:var(--muted2)}
hr.rule{border:0;border-top:1px solid var(--border);margin:38px 0}

ul.ticks,ul.plain{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:11px}
ul.ticks li{position:relative;padding-left:22px;color:var(--muted);max-width:74ch}
ul.ticks li::before{content:"";position:absolute;left:3px;top:10px;width:6px;height:6px;background:var(--accent);border-radius:1px;transform:rotate(45deg)}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:16px}
ol.steps li{position:relative;padding-left:38px;color:var(--muted);max-width:74ch}
ol.steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);position:absolute;left:0;top:1px;font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.06em}

.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface);margin:14px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:min(100%,540px)}
th,td{text-align:right;padding:11px 16px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;vertical-align:top}
th:first-child,td:first-child{text-align:left}
thead th{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody td{color:var(--muted)}
tbody td b,tbody td strong{color:var(--ink)}
td.neg{color:var(--neg)}td.pos{color:var(--pos)}td.mut{color:var(--muted2)}
tr.total td{border-top:1px solid var(--border2);color:var(--ink);font-weight:600}
td small,th small{display:block;font-size:11.5px;color:var(--muted2);font-weight:400;margin-top:3px;line-height:1.4}

.stats,.stats2,.stats4{display:grid;gap:13px;margin:16px 0}
.stats{grid-template-columns:repeat(3,1fr)}
.stats2{grid-template-columns:repeat(2,1fr)}
.stats4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:17px 18px}
.stat .b{font-family:var(--serif);font-weight:600;font-size:clamp(21px,2.9vw,27px);letter-spacing:-.015em;color:var(--ink);line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.stat .s{font-family:var(--mono);font-size:10px;color:var(--muted2);margin-top:8px;letter-spacing:.05em;text-transform:uppercase}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:16px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
.card h5{margin:0 0 8px;font-size:14.5px;font-weight:700;color:var(--ink)}
.card p{font-size:13.5px;margin:0;color:var(--muted)}
.card .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}

blockquote.rules{margin:16px 0;padding:0;display:flex;flex-direction:column;gap:18px}
blockquote.rules > div{border-left:2px solid var(--border2);padding-left:18px}
blockquote.rules b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:5px}
blockquote.rules span{color:var(--muted);font-size:13.5px;line-height:1.55;display:block;max-width:72ch}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin:18px 0}
.panel.accent{border-color:rgba(255,128,82,.32);background:linear-gradient(180deg,rgba(255,128,82,.06),rgba(255,128,82,.015))}
.panel .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.panel.accent .k{color:var(--accent)}
.panel p:last-child{margin-bottom:0}

.note{font-family:var(--mono);font-size:11.5px;color:var(--muted2);line-height:1.65;margin-top:14px;max-width:92ch}
.note b{color:var(--muted)}
.src{font-family:var(--mono);font-size:11px;color:var(--muted2);line-height:1.6;margin-top:10px;max-width:96ch}
.src b{color:var(--muted)}
.fine{font-family:var(--mono);font-size:11px;color:var(--muted2);line-height:1.65;margin-top:12px;max-width:96ch}

.pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border2);border-radius:999px;padding:4px 10px;margin-right:6px}
.pill.ok{color:var(--pos);border-color:rgba(74,222,128,.35)}
.pill.warnp{color:var(--warn);border-color:rgba(251,191,36,.35)}
.pill.negp{color:var(--neg);border-color:rgba(248,113,113,.35)}
.pill.acc{color:var(--accent);border-color:rgba(255,128,82,.4)}

.fq{border:1px solid var(--border);border-radius:12px;margin-bottom:9px;background:var(--surface);overflow:hidden}
.fq summary{cursor:pointer;padding:15px 18px;font-weight:600;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:14px;align-items:center;color:var(--ink)}
.fq summary::-webkit-details-marker{display:none}
.fq summary::after{content:"+";color:var(--muted);font-size:19px;line-height:1;flex:none}
.fq[open] summary::after{content:"\2013"}
.fq .ans{padding:0 18px 17px;color:var(--muted);font-size:13.5px;line-height:1.65;max-width:82ch}
.fq .ans p{font-size:13.5px}
.fq .ans p:last-child{margin-bottom:0}
.grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin:26px 0 10px}

.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:13px;margin-top:10px}
.nav a{display:block;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:19px;text-decoration:none;transition:border-color .15s,background .15s}
.nav a:hover{border-color:var(--border2);background:var(--surface2)}
.nav .n{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.08em}
.nav h3{font-family:var(--serif);font-weight:600;font-size:18px;margin:9px 0 6px;color:var(--ink);letter-spacing:-.01em}
.nav p{font-size:13px;color:var(--muted);margin:0;line-height:1.5}

.btn{display:inline-block;padding:13px 20px;border-radius:12px;font-weight:600;font-size:14.5px;text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--ink);border-color:var(--border2)}
.cta-row{display:flex;gap:11px;flex-wrap:wrap;margin-top:6px}

.foot{padding:28px 0 60px;border-top:1px solid var(--border);margin-top:30px}
.foot .back{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.foot .back:hover{color:var(--ink)}

/* Screenshots */
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:18px 0}
.shot{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface)}
.shot img{display:block;width:100%;height:auto}
.shot .cap{padding:12px 15px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--border);line-height:1.5}
.shot .cap b{color:var(--ink);display:block;margin-bottom:3px;font-size:13px}
.phones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:18px 0;max-width:900px}
.phone{border:1px solid var(--border);border-radius:20px;overflow:hidden;background:#000}
.phone img{display:block;width:100%;height:auto}
.phone .cap{padding:10px 12px;font-size:11.5px;color:var(--muted);background:var(--surface);border-top:1px solid var(--border);text-align:center}
.wide{max-width:none}

/* Revenue chart */
.chart{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px clamp(14px,3vw,28px) 14px;margin:18px 0}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart-grid{stroke:var(--border);stroke-width:1;stroke-dasharray:2 4}
.chart-axis{stroke:var(--border2);stroke-width:1}
.chart-line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;pathLength:1;stroke-dasharray:1;stroke-dashoffset:1;animation:chartdraw 1.7s cubic-bezier(.16,.7,.3,1) forwards}
.chart-line.basis{stroke:var(--muted)}
.chart-line.upper{stroke:var(--accent);animation-delay:.2s}
.chart-area{opacity:0;animation:chartfade 1.2s ease-out .9s forwards}
.chart-dot{opacity:0;transform-origin:center;animation:chartdot .5s cubic-bezier(.2,1.4,.4,1) forwards}
.chart-dot.basis{fill:var(--muted)}
.chart-dot.upper{fill:var(--accent)}
.chart-val{font-family:var(--mono);font-size:10.5px;opacity:0;animation:chartdot .5s ease-out forwards}
.chart-val.basis{fill:var(--muted2)}
.chart-val.upper{fill:var(--accent)}
.chart-xlabel{font-family:var(--mono);font-size:10.5px;fill:var(--muted2);text-transform:uppercase;letter-spacing:.05em}
.chart-legend{display:flex;gap:20px;justify-content:flex-end;padding:0 0 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chart-legend span{display:inline-flex;align-items:center;gap:7px}
.chart-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chart-legend .b i{background:var(--muted)}
.chart-legend .u i{background:var(--accent)}
@keyframes chartdraw{to{stroke-dashoffset:0}}
@keyframes chartfade{to{opacity:1}}
@keyframes chartdot{to{opacity:1;transform:scale(1)}}

@media(max-width:760px){
 .cols,.cols3,.stats,.stats4,.stats2{grid-template-columns:1fr}
 .stats4{grid-template-columns:1fr 1fr}
 body{font-size:14.5px}
}

#gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;overflow:hidden;background:var(--paper);z-index:100}
.gatecard{position:relative;z-index:3;width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 32px 28px;text-align:center}
.g-brand{font-family:var(--serif);font-weight:600;font-size:21px;color:var(--ink);margin:0 0 20px}
.lock{width:52px;height:52px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);display:grid;place-items:center;margin:0 auto 18px}
.lock svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#gate h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 8px;color:var(--ink)}
#gate .gsub{color:var(--muted);font-size:13.5px;margin:0 auto 22px;max-width:32ch}
#pw{width:100%;padding:13px 16px;border-radius:11px;border:1px solid var(--border2);background:var(--surface2);color:var(--ink);font-size:16px;text-align:center;letter-spacing:.12em;font-family:var(--mono)}
#pw::placeholder{letter-spacing:.02em;color:var(--muted2);font-family:var(--sans)}
#pw:focus{outline:none;border-color:var(--accent)}
#go{width:100%;margin-top:11px;padding:13px;border:0;border-radius:11px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14.5px;cursor:pointer}
#err{color:var(--neg);font-size:12.5px;min-height:18px;margin-top:11px}
.g-foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2)}
#app{display:none}
body.has-pw #gate{display:none}
body.has-pw #app{display:block}
#top{position:sticky;top:0;z-index:5;height:50px;display:flex;align-items:center;gap:16px;padding:0 clamp(16px,4vw,40px);background:rgba(9,9,11,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase}
#top a{color:var(--muted);text-decoration:none;white-space:nowrap}#top a:hover{color:var(--ink)}#top .t{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#frame{width:100%;height:calc(100vh - 50px);border:0;background:var(--paper);display:block}
